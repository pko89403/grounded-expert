name: Squad task
description: 기획 → 개발 → 리뷰 → 개발 → 배포까지 squad pipeline이 처리할 작업
title: "[squad] "
labels: ["squad"]
body:
  - type: markdown
    attributes:
      value: |
        이 issue는 squad pipeline의 입력입니다. 저장소 owner가 등록한 issue만 실행되고, 아래 예산이 이 작업의 상한입니다.
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 무엇을 바꾸거나 만들지, 왜 필요한지
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 배경과 관련 링크
      description: 관련 issue, PR, 문서, 피드백
  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준
      description: 비워 두면 기획이 작성합니다
  - type: textarea
    id: out-of-scope
    attributes:
      label: 범위 밖
  - type: input
    id: budget-agents
    attributes:
      label: 예산 — agent 수 상한
      placeholder: "7"
  - type: input
    id: budget-tokens
    attributes:
      label: 예산 — 토큰 상한
      placeholder: "1.2M"
  - type: input
    id: budget-usd
    attributes:
      label: 예산 — 유료 eval 달러 상한
      placeholder: "40"
  - type: input
    id: budget-loops
    attributes:
      label: 예산 — 리뷰 후 되돌림 횟수 상한
      placeholder: "1"
  - type: dropdown
    id: deploy
    attributes:
      label: 배포
      options:
        - 배포까지 자동 진행 (feature PR merge → release PR merge)
        - draft PR에서 멈춤
      default: 0
    validations:
      required: true
  - type: dropdown
    id: on-question
    attributes:
      label: owner 결정이 필요한 질문이 생기면
      options:
        - 보수적 기본값으로 진행하고 목록을 남김 (기획이 막힘으로 표시한 질문은 배포 전에 멈춤)
        - 배포 전에 항상 멈추고 묻기
      default: 0
    validations:
      required: true
