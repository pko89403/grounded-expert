name: Squad task
description: 기획 → 개발 → 리뷰 → 개발 → 배포까지 squad pipeline이 처리할 작업
title: '[squad] '
labels:
- squad
body:
- type: markdown
  attributes:
    value: '이 issue는 squad pipeline의 입력입니다. 저장소 owner가 등록한 issue만 실행됩니다.

      '
- type: textarea
  id: goal
  attributes:
    label: 목표
    description: 무엇을 바꾸거나 만들지, 왜 필요한지
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: 배경과 관련 링크
    description: 관련 issue, PR, 문서, 피드백
- type: textarea
  id: acceptance
  attributes:
    label: 수용 기준
    description: 비워 두면 기획이 작성합니다
- type: textarea
  id: out-of-scope
  attributes:
    label: 범위 밖
