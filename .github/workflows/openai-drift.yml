name: openai-skill-drift

on:
  pull_request:
    paths:
      - plugin/SKILL.md
      - hosts/openai/skills/grounded-expert/SKILL.md
      - scripts/check-openai-drift.sh
      - .github/workflows/openai-drift.yml
  push:
    branches: [main]
    paths:
      - plugin/SKILL.md
      - hosts/openai/skills/grounded-expert/SKILL.md
      - scripts/check-openai-drift.sh
      - .github/workflows/openai-drift.yml

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-openai-drift.sh
