name: check-quotes

on:
  pull_request:
    paths:
      - tools/**
      - plugin/SKILL.md
      - .github/workflows/check-quotes.yml
  push:
    branches: [main]
    paths:
      - tools/**
      - plugin/SKILL.md
      - .github/workflows/check-quotes.yml

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I tools/check_quotes.py --self-test
