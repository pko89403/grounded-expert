name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job id is the required status check name; keep it "validate".
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      # `claude plugin validate` runs offline and needs no API key or login.
      - run: npm install -g @anthropic-ai/claude-code@2.1.304
      - run: claude plugin validate --strict plugin
      - run: claude plugin validate --strict .

  # Non-blocking for now: external links can flake. Make blocking once stable.
  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress './**/*.md'
          fail: true
